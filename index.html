<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Notepad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 10px;
    background: #1e1e1e;
    color: #fff;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Center the toolbar horizontally */
  #toolbar-container {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
  }

  #toolbar {
    display: flex;
    gap: 12px;                    /* Slightly more spacing for better touch targets */
    flex-wrap: wrap;
    justify-content: center;      /* Centers buttons inside the toolbar */
  }

  #toolbar button {
    padding: 8px 14px;            /* Bigger touch area */
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    cursor: pointer;
    font-size: 18px;              /* Slightly larger for visibility */
    min-width: 50px;              /* Consistent button size */
  }

  #editor-wrapper {
    flex: 1;
    background: #2a2a2a;
    border-radius: 8px;
    overflow: auto;
    padding: 20px;
  }

  #editor {
    height: 100%;
    min-height: 100%;
    outline: none;
    font-size: 28px;
    text-align: center;
    line-height: 1.5;
    background: transparent;
  }

  /* Hide scrollbar completely */
  #editor-wrapper {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  #editor-wrapper::-webkit-scrollbar {
    display: none;
  }

  html, body {
    overflow: hidden;
  }
</style>
</head>
<body>

<div id="toolbar-container">
  <div id="toolbar">
    <button onclick="document.execCommand('bold')"><b>B</b></button>
    <button onclick="document.execCommand('italic')"><i>I</i></button>
    <button onclick="document.execCommand('underline')"><u>U</u></button>
  </div>
</div>

<div id="editor-wrapper">
  <div id="editor" contenteditable="true">Start typing here...</div>
</div>

<script>
  const editor = document.getElementById('editor');

  // Load saved notes or use default
  editor.innerHTML = localStorage.notes || '<p>Start typing here...</p>';

  // Save on every change
  editor.addEventListener('input', () => {
    localStorage.notes = editor.innerHTML;
  });

  // Ctrl+B/I/U shortcuts
  editor.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      switch (e.key.toLowerCase()) {
        case 'b':
          e.preventDefault();
          document.execCommand('bold');
          break;
        case 'i':
          e.preventDefault();
          document.execCommand('italic');
          break;
        case 'u':
          e.preventDefault();
          document.execCommand('underline');
          break;
      }
    }
  });
</script>

</body>
</html>
