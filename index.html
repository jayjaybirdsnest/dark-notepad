<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Notepad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:10px; background:#1e1e1e; color:#fff; font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column; }
  #toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  #toolbar button, #toolbar select {
    padding:5px 8px; border:none; border-radius:4px; background:#333; color:#fff; cursor:pointer;
  }
  #editor {
    flex:1; background:#2a2a2a; border-radius:8px; padding:15px; overflow:auto;
    font-size:24px; text-align:center; line-height:1.5; outline:none;
  }
#editor {
  scrollbar-width: thin;
  scrollbar-color: #444 #2a2a2a;   /* very dark thumb + matching track */
}

#editor::-webkit-scrollbar {
  width: 8px;
}

#editor::-webkit-scrollbar-track {
  background: #2a2a2a;             /* exact editor bg → disappears into background */
}

#editor::-webkit-scrollbar-thumb {
  background: #444;                /* super dark gray */
  border-radius: 999px;
  border: 2px solid #2a2a2a;      /* inset so it doesn't look blocky */
}

#editor::-webkit-scrollbar-thumb:hover {
  background: #666;                /* noticeable only on hover */
}
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="document.execCommand('bold')"><b>B</b></button>
  <button onclick="document.execCommand('italic')"><i>I</i></button>
  <button onclick="document.execCommand('underline')"><u>U</u></button>
  <select id="headingSelect" onchange="setHeading(this.value)">
    <option value='p'>Normal</option>
    <option value='h1'>H1</option>
    <option value='h2'>H2</option>
    <option value='h3'>H3</option>
  </select>
  <select id="fontSelect" onchange="setFont(this.value)">
    <option value='Inter'>Inter</option>
    <option value='Roboto'>Roboto</option>
    <option value='Monospace'>Monospace</option>
    <option value='Serif'>Serif</option>
  </select>
  <select id="fontSizeSelect" onchange="setFontSize(this.value)">
    <option value='16'>16px</option>
    <option value='20'>20px</option>
    <option value='24' selected>24px</option>
    <option value='28'>28px</option>
    <option value='32'>32px</option>
    <option value='40'>40px</option>
    <option value='48'>48px</option>
  </select>
  <select id="alignSelect" onchange="setAlign(this.value)">
    <option value='center' selected>Center</option>
    <option value='left'>Left</option>
    <option value='right'>Right</option>
    <option value='justify'>Justify</option>
  </select>
</div>

<div id="editor" contenteditable="true">Start typing here...</div>

<script>
const editor = document.getElementById('editor');
editor.innerHTML = localStorage.notes || editor.innerHTML;
editor.addEventListener('input', () => localStorage.notes = editor.innerHTML);

function setHeading(tag) { document.execCommand('formatBlock', false, tag); }
function setFont(font) { document.execCommand('fontName', false, font); }
function setFontSize(size) {
  document.execCommand('fontSize', false, '7');
  editor.querySelectorAll('font[size="7"]').forEach(f => f.removeAttribute('size'));
  editor.style.fontSize = size + 'px';
}
function setAlign(alignment) { document.execCommand('justify' + alignment.charAt(0).toUpperCase() + alignment.slice(1)); }
</script>

</body>
</html>
